<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Check-in</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f6feb">
<script src="html5-qrcode.min.js"></script>
<style>
  :root { --bg: #f2f2f2; --card: #ffffff; --text: #1b1b1b; --line: #c9c9c9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1e1e1e; --text: #eeeeee; --line: #444444; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, Arial, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px; }
  select, input, button {
    width: 100%; min-height: 52px; font-size: 18px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text);
  }
  button { font-weight: bold; }
  #count { font-size: 26px; font-weight: bold; text-align: center; margin: 12px 0; }
  #reader { width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
  #start { margin: 10px 0; background: #1f6feb; color: #fff; border: 0; }
  #result {
    margin: 10px 0; padding: 16px; min-height: 110px; text-align: center;
    border-radius: 8px; background: var(--card); border: 1px solid var(--line);
  }
  #result .name { font-size: 28px; font-weight: bold; }
  #result .info { font-size: 18px; margin-top: 6px; }
  #result.ok { background: #2e9e4f; border-color: #2e9e4f; color: #fff; }
  #result.dupe { background: #f5a623; border-color: #f5a623; color: #000; }
  #result.bad { background: #d63031; border-color: #d63031; color: #fff; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row input { flex: 1; }
  .row button { width: 120px; }
  .hide { display: none; }
  .tabs { display: flex; gap: 8px; margin-top: 10px; }
  .tabs button { flex: 1; width: auto; }
  .tabs button.on, .chips button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; }
  .tile b { display: block; font-size: 28px; }
  .tile span { font-size: 13px; opacity: 0.8; }
  #search { margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; margin-bottom: 10px; }
  .chips button { flex: 1; width: auto; min-height: 44px; padding: 0 6px; font-size: 15px; }
  .person {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 12px; margin-bottom: 6px; background: var(--card);
    border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 8px;
  }
  .person.inside { border-left-color: #2e9e4f; }
  .person.out { border-left-color: #7b3fe4; }
  .person.guest { border-left-color: #d63031; }
  .person .who { font-weight: bold; font-size: 17px; }
  .person .sub { font-size: 13px; opacity: 0.75; }
  .person .times { text-align: right; font-size: 14px; white-space: nowrap; }
  .empty { text-align: center; padding: 20px; opacity: 0.7; }
  .mode { display: flex; gap: 8px; margin-top: 10px; }
  .mode button { flex: 1; width: auto; }
  #modeIn.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #modeOut.on { background: #7b3fe4; border-color: #7b3fe4; color: #fff; }
  #status { font-size: 14px; text-align: center; margin-top: 12px; opacity: 0.8; }
  #reload, #clear { width: auto; min-height: 44px; border: 0; background: none; font-size: 14px; font-weight: normal; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <select id="event"></select>
  <div class="tabs">
    <button id="tabScan" class="on">Scan</button>
    <button id="tabDash">Dashboard</button>
  </div>
  <div id="count">0 / 0 checked in</div>

  <div id="scanView">
    <div class="mode">
      <button id="modeIn">Time in</button>
      <button id="modeOut">Time out</button>
    </div>

    <div id="reader"></div>
    <button id="start">Start camera</button>

    <div id="result"><div class="name">Ready</div><div class="info"></div></div>

    <div class="row">
      <input id="manual" placeholder="Type student ID">
      <button id="manualBtn">Check in</button>
    </div>
    <button id="undo">Undo last scan</button>
  </div>

  <div id="dashView" class="hide">
    <div class="tiles">
      <div class="tile"><b id="tIn">0</b><span>Checked in</span></div>
      <div class="tile"><b id="tInside">0</b><span>Inside now</span></div>
      <div class="tile"><b id="tOut">0</b><span>Checked out</span></div>
      <div class="tile"><b id="tNot">0</b><span>Not yet arrived</span></div>
    </div>
    <input id="search" placeholder="Search name or ID">
    <div class="chips" id="chips">
      <button data-f="all" class="on">All</button>
      <button data-f="inside">Inside</button>
      <button data-f="out">Out</button>
      <button data-f="not">Not yet</button>
    </div>
    <div id="people"></div>
  </div>

  <div id="status"></div>
  <div style="text-align:center">
    <button id="reload">Reload student list</button>
    <button id="clear">Clear data from this phone</button>
  </div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbyUTV_Tt-BJYOdTKuj-SsvdvKbJB96wK-fHZU0o_oVO-qgVhv8nAG9rOCdDXuUTEkra2Q/exec';
var KEY = 'ra3r4n-wr1mzb-nerisy-g7p6zh';

var students = {};
var studentCount = 0;
var events = [];
var serverScans = [];
var queue = load('attend_queue', []);
var done = {};
var lastId = '';
var lastTime = 0;
var lastUid = null;
var sending = [];
var lastError = '';
var busy = false;
var cleared = false;
var mode = 'IN';
var view = 'scan';
var filter = 'all';
try {
  if (localStorage.getItem('attend_mode') === 'OUT') mode = 'OUT';
} catch (e) {}
var scanner = null;
var audio = null;

function $(id) { return document.getElementById(id); }

function load(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) || fallback;
  } catch (e) {
    return fallback;
  }
}

function save(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

// fetch that gives up after 15 seconds so weak wifi doesn't hang the sync
function call(url, options) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 15000);
  options = options || {};
  options.signal = ctrl.signal;
  return fetch(url, options).then(function (r) {
    clearTimeout(timer);
    return r.json();
  }, function (err) {
    clearTimeout(timer);
    throw err;
  });
}

// ---------- data ----------

function useData(data) {
  students = {};
  data.students.forEach(function (r) {
    students[r[0]] = { name: r[1], grade: r[2], course: r[3] };
  });
  studentCount = data.students.length;
  events = data.events;
  serverScans = data.scans;
  fillEvents();
  rebuildDone();
  showCount();
}

function loadAll() {
  if (cleared) return;
  call(API_URL + '?key=' + encodeURIComponent(KEY)).then(function (data) {
    if (!data.ok) {
      lastError = 'server says: ' + data.error;
      showStatus();
      return;
    }
    save('attend_cache', data);
    useData(data);
  }).catch(function () {
    if (!events.length) {
      show('', 'No connection', 'Connect once to download the student list');
    }
  });
}

function fillEvents() {
  var box = $('event');
  var keep = box.value || localStorage.getItem('attend_event') || '';
  if (events.indexOf(keep) === -1) keep = '';
  box.innerHTML = '<option value="">Choose event...</option>';
  events.forEach(function (name) {
    var o = document.createElement('option');
    o.value = name;
    o.textContent = name;
    box.appendChild(o);
  });
  box.value = keep;
}

function mark(ev, id, type) {
  var key = ev + '|' + type;
  if (!done[key]) done[key] = {};
  done[key][id] = true;
}

function isDone(ev, id, type) {
  var list = done[ev + '|' + type];
  return !!(list && list[id]);
}

function rebuildDone() {
  done = {};
  serverScans.forEach(function (s) { mark(s[0], s[1], s[2] || 'IN'); });
  queue.forEach(function (s) { mark(s.event, s.id, s.type || 'IN'); });
}

// ---------- scanning ----------

function checkIn(text, manual) {
  var id = String(text).trim();
  var ev = $('event').value;
  var now = Date.now();
  if (!id) return;

  // same card within 3 seconds is ignored
  if (!manual && id === lastId && now - lastTime < 3000) return;
  lastId = id;
  lastTime = now;

  if (!ev) {
    show('bad', 'Choose an event first', '');
    return;
  }

  var s = students[id];
  var out = mode === 'OUT';

  if (isDone(ev, id, mode)) {
    show('dupe', s ? s.name : 'GUEST', out ? 'Already checked out' : 'Already checked in');
    return;
  }

  // leaving without ever checking in is still saved, but flagged
  var noIn = out && !isDone(ev, id, 'IN');

  var item = {
    uid: now + '-' + Math.random().toString(36).slice(2, 7),
    event: ev,
    id: id,
    type: mode,
    time: new Date().toISOString()
  };
  queue.push(item);
  save('attend_queue', queue);
  lastUid = item.uid;
  mark(ev, id, mode);
  showCount();
  showStatus();

  var info = s ? 'Grade ' + s.grade + ' - ' + s.course : '';
  if (!s) {
    show('bad', 'Unknown ID', id + ' saved as GUEST');
  } else if (noIn) {
    show('dupe', s.name, 'Checked out, but no check-in found');
  } else if (out) {
    show('ok', s.name, 'Checked out - ' + info);
  } else {
    show('ok', s.name, info);
  }
}

function show(kind, title, info) {
  var box = $('result');
  box.className = kind;
  box.querySelector('.name').textContent = title;
  box.querySelector('.info').textContent = info;
  if (kind) feedback(kind);
}

function feedback(kind) {
  if (navigator.vibrate) {
    navigator.vibrate(kind === 'ok' ? 100 : [150, 80, 150]);
  }
  if (!audio) return;
  var tones = {
    ok: [[880, 0.12]],
    dupe: [[440, 0.12], [440, 0.12]],
    bad: [[220, 0.4]]
  };
  var t = audio.currentTime;
  tones[kind].forEach(function (tone, i) {
    var osc = audio.createOscillator();
    var gain = audio.createGain();
    osc.frequency.value = tone[0];
    gain.gain.value = 0.2;
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start(t + i * 0.2);
    osc.stop(t + i * 0.2 + tone[1]);
  });
}

function showCount() {
  var ev = $('event').value;
  var ins = done[ev + '|IN'] || {};
  var outs = done[ev + '|OUT'] || {};
  var n = 0;
  var guests = 0;
  for (var id in ins) {
    if (students[id]) n++;
    else guests++;
  }
  var text = n + ' / ' + studentCount + ' checked in';
  if (guests) text += ' (+' + guests + ' guest' + (guests > 1 ? 's' : '') + ')';
  var left = Object.keys(outs).length;
  if (left) text += ' - ' + left + ' out';
  $('count').textContent = text;
  if (view === 'dash') drawDash();
}

// ---------- dashboard ----------

function timeText(ms) {
  if (!ms) return '-';
  return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// first time in and first time out for every ID at one event
function gather(ev) {
  var rec = {};
  function add(id, type, ms) {
    var key = type === 'OUT' ? 'out' : 'in';
    if (!rec[id]) rec[id] = {};
    if (rec[id][key] === undefined || ms < rec[id][key]) rec[id][key] = ms;
  }
  serverScans.forEach(function (s) {
    if (s[0] === ev) add(s[1], s[2] || 'IN', Number(s[3]) || 0);
  });
  queue.forEach(function (q) {
    if (q.event === ev) add(q.id, q.type || 'IN', Date.parse(q.time) || 0);
  });
  return rec;
}

function drawDash() {
  var ev = $('event').value;
  var box = $('people');
  box.innerHTML = '';
  if (!ev) {
    box.innerHTML = '<div class="empty">Choose an event first</div>';
    return;
  }

  var rec = gather(ev);
  var rows = [];
  var arrived = 0, inside = 0, out = 0, notYet = 0;

  Object.keys(students).forEach(function (id) {
    var r = rec[id] || {};
    var status = r.out !== undefined ? 'out' : (r.in !== undefined ? 'inside' : 'not');
    if (r.in !== undefined) arrived++;
    if (status === 'inside') inside++;
    if (status === 'out') out++;
    if (status === 'not') notYet++;
    rows.push({
      id: id, name: students[id].name,
      sub: id + ' - Grade ' + students[id].grade + ' - ' + students[id].course,
      tin: r.in, tout: r.out, status: status,
      last: Math.max(r.in || 0, r.out || 0)
    });
  });
  Object.keys(rec).forEach(function (id) {
    if (students[id]) return;
    var r = rec[id];
    rows.push({
      id: id, name: 'GUEST', sub: id + ' - not in student list',
      tin: r.in, tout: r.out, status: 'guest',
      last: Math.max(r.in || 0, r.out || 0)
    });
  });

  $('tIn').textContent = arrived;
  $('tInside').textContent = inside;
  $('tOut').textContent = out;
  $('tNot').textContent = notYet;

  var q = $('search').value.trim().toLowerCase();
  rows = rows.filter(function (r) {
    if (filter !== 'all' && r.status !== filter) return false;
    return !q || r.name.toLowerCase().indexOf(q) > -1 || r.id.toLowerCase().indexOf(q) > -1;
  });
  // latest activity first, people who haven't arrived at the bottom by name
  rows.sort(function (a, b) {
    if (a.last !== b.last) return b.last - a.last;
    return a.name.localeCompare(b.name);
  });

  if (!rows.length) {
    box.innerHTML = '<div class="empty">Nobody here</div>';
    return;
  }
  rows.forEach(function (r) {
    var row = document.createElement('div');
    row.className = 'person ' + r.status;

    var who = document.createElement('div');
    var name = document.createElement('div');
    name.className = 'who';
    name.textContent = r.name;
    var sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = r.sub;
    who.appendChild(name);
    who.appendChild(sub);

    var times = document.createElement('div');
    times.className = 'times';
    if (r.status === 'not') {
      times.textContent = 'Not yet';
    } else {
      times.appendChild(document.createTextNode('In ' + (r.tin === undefined ? '-' : timeText(r.tin))));
      times.appendChild(document.createElement('br'));
      times.appendChild(document.createTextNode('Out ' + (r.tout === undefined ? '-' : timeText(r.tout))));
    }

    row.appendChild(who);
    row.appendChild(times);
    box.appendChild(row);
  });
}

function setView(v) {
  view = v;
  $('scanView').className = v === 'scan' ? '' : 'hide';
  $('dashView').className = v === 'dash' ? '' : 'hide';
  $('tabScan').className = v === 'scan' ? 'on' : '';
  $('tabDash').className = v === 'dash' ? 'on' : '';
  // pause the camera while looking at the dashboard
  if (scanner) {
    try {
      if (v === 'dash') scanner.pause(true);
      else scanner.resume();
    } catch (e) {}
  }
  if (v === 'dash') drawDash();
}

function showStatus() {
  var text = (navigator.onLine ? 'Online' : 'Offline') + ' - ' + queue.length + ' waiting to sync';
  if (lastError) text += ' - ' + lastError;
  $('status').textContent = text;
}

// ---------- syncing ----------

function tick() {
  if (cleared || busy || !navigator.onLine) return;
  busy = true;
  var batch = queue.slice();
  sending = batch.map(function (b) { return b.uid; });

  var step = batch.length ? send(batch) : Promise.resolve();
  step.then(function () {
    return call(API_URL + '?key=' + encodeURIComponent(KEY) + '&part=scans');
  }).then(function (data) {
    if (!data.ok) throw new Error(data.error);
    serverScans = data.scans;
    var cache = load('attend_cache', null);
    if (cache) {
      cache.scans = data.scans;
      save('attend_cache', cache);
    }
    lastError = '';
    rebuildDone();
    showCount();
  }).catch(function (err) {
    lastError = err.message === 'bad key' ? 'wrong secret key' : 'will retry';
  }).then(function () {
    busy = false;
    sending = [];
    showStatus();
    if (!events.length) loadAll();
  });
}

function send(batch) {
  return call(API_URL, {
    method: 'POST',
    body: JSON.stringify({ key: KEY, scans: batch })
  }).then(function (res) {
    if (!res.ok) throw new Error(res.error);
    var sent = {};
    batch.forEach(function (b) { sent[b.uid] = true; });
    queue = queue.filter(function (q) { return !sent[q.uid]; });
    save('attend_queue', queue);
  });
}

// ---------- buttons ----------

$('start').onclick = function () {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (scanner) return;
  scanner = new Html5Qrcode('reader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
  });
  scanner.start(
    { facingMode: 'environment' },
    {
      fps: 10,
      qrbox: function (w, h) {
        var size = Math.floor(Math.min(w, h) * 0.7);
        return { width: size, height: size };
      }
    },
    function (text) { checkIn(text, false); }
  ).then(function () {
    $('start').style.display = 'none';
  }).catch(function () {
    scanner = null;
    show('bad', 'Camera problem', 'Allow camera access and try again');
  });
};

$('manualBtn').onclick = function () {
  checkIn($('manual').value, true);
  $('manual').value = '';
};

$('manual').onkeydown = function (e) {
  if (e.key === 'Enter') $('manualBtn').onclick();
};

$('undo').onclick = function () {
  var i = queue.findIndex(function (q) { return q.uid === lastUid; });
  if (lastUid !== null && sending.indexOf(lastUid) !== -1) {
    show('dupe', 'Too late', 'That scan is already being sent');
    return;
  }
  if (i === -1) {
    show('dupe', 'Cannot undo', 'Last scan is already synced');
    return;
  }
  queue.splice(i, 1);
  save('attend_queue', queue);
  lastUid = null;
  lastId = '';
  rebuildDone();
  showCount();
  showStatus();
  show('', 'Scan removed', '');
};

$('event').onchange = function () {
  localStorage.setItem('attend_event', this.value);
  showCount();
};

function setMode(m) {
  mode = m;
  lastId = '';
  try { localStorage.setItem('attend_mode', m); } catch (e) {}
  $('modeIn').className = m === 'IN' ? 'on' : '';
  $('modeOut').className = m === 'OUT' ? 'on' : '';
}

$('tabScan').onclick = function () { setView('scan'); };
$('tabDash').onclick = function () { setView('dash'); };
$('search').oninput = drawDash;

var chipButtons = $('chips').querySelectorAll('button');
for (var i = 0; i < chipButtons.length; i++) {
  chipButtons[i].onclick = function () {
    filter = this.getAttribute('data-f');
    for (var j = 0; j < chipButtons.length; j++) {
      chipButtons[j].className = chipButtons[j] === this ? 'on' : '';
    }
    drawDash();
  };
}

$('modeIn').onclick = function () { setMode('IN'); };
$('modeOut').onclick = function () { setMode('OUT'); };

$('reload').onclick = function () {
  cleared = false;
  loadAll();
};

// wipes the student list and saved scans from this phone
$('clear').onclick = function () {
  var warning = queue.length
    ? queue.length + ' scans have not synced yet and will be lost. Clear anyway?'
    : 'Remove the student list from this phone?';
  if (!confirm(warning)) return;
  try {
    localStorage.removeItem('attend_cache');
    localStorage.removeItem('attend_queue');
    localStorage.removeItem('attend_event');
  } catch (e) {}
  cleared = true;
  students = {};
  studentCount = 0;
  events = [];
  serverScans = [];
  queue = [];
  done = {};
  fillEvents();
  showCount();
  showStatus();
  show('', 'Data cleared', 'Close the app. Tap Reload to download the list again.');
};
window.addEventListener('online', function () { showStatus(); tick(); });
window.addEventListener('offline', showStatus);

// ---------- start ----------

setMode(mode);
var cached = load('attend_cache', null);
if (cached) useData(cached);
showStatus();
loadAll();
setInterval(tick, 10000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
